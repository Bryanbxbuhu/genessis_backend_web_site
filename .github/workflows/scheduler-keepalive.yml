name: Keep scheduled updates active

on:
  schedule:
    # Public-repository schedules are disabled after 60 days without activity.
    # A monthly heartbeat keeps the critical daily updater eligible to run.
    - cron: "43 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Record scheduler heartbeat
        run: |
          date -u +%Y-%m > .github/scheduler-heartbeat
          if git diff --quiet -- .github/scheduler-heartbeat; then
            echo "Heartbeat is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scheduler-heartbeat
          git commit -m "chore: keep scheduled reports active"
          git push
