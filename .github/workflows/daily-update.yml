name: Daily data sync and report update

on:
  schedule:
    # Stagger away from the top of the hour to reduce delayed/dropped runs.
    # Europe
    - cron: "17 6 * * *"
    # US/Americas
    - cron: "27 12 * * *"
    # Asia
    - cron: "37 23 * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Region to process (us, europe, asia, or all)"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: daily-data-sync
  cancel-in-progress: false

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests

  us-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: regression-tests
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.region == 'us' || inputs.region == 'all')) || (github.event_name == 'schedule' && github.event.schedule == '27 12 * * *') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
          python -m pip install --no-cache-dir -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Reset and sync scoped runtime data (Americas)
        run: python scripts/reset_and_sync.py --region americas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY || secrets.RAPID_API_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY || secrets.RAPIDAPI_KEY }}
      - name: Generate Americas reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY || secrets.RAPID_API_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY || secrets.RAPIDAPI_KEY }}
          WIKIMEDIA_CLIENT_ID: ${{ secrets.WIKIMEDIA_CLIENT_ID }}
          WIKIMEDIA_CLIENT_SECRET: ${{ secrets.WIKIMEDIA_CLIENT_SECRET }}
          LOS_ANGELES_WIKIMEDIA_ENRICHMENT_ENABLED: "true"
          MEXICO_CITY_WIKIMEDIA_ENRICHMENT_ENABLED: "true"
        run: |
          failed=""
          for city in miami new-york san-francisco los-angeles minneapolis richmond mexico-city; do
            if ! python run_report.py "$city" --skip-pdf; then
              failed="$failed $city"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed reports:$failed"
            exit 1
          fi
      - name: Verify fresh Americas data
        run: >-
          python scripts/check_data_freshness.py --max-age-hours 6 --cities
          miami new-york san-francisco los-angeles minneapolis richmond mexico-city
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  europe-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: regression-tests
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.region == 'europe' || inputs.region == 'all')) || (github.event_name == 'schedule' && github.event.schedule == '17 6 * * *') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
          python -m pip install --no-cache-dir -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Reset and sync scoped runtime data (Europe)
        run: python scripts/reset_and_sync.py --region europe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY || secrets.RAPID_API_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY || secrets.RAPIDAPI_KEY }}
      - name: Generate Europe reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY || secrets.RAPID_API_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY || secrets.RAPIDAPI_KEY }}
          WIKIMEDIA_CLIENT_ID: ${{ secrets.WIKIMEDIA_CLIENT_ID }}
          WIKIMEDIA_CLIENT_SECRET: ${{ secrets.WIKIMEDIA_CLIENT_SECRET }}
          BERLIN_WIKIMEDIA_ENRICHMENT_ENABLED: "true"
          DUBAI_WIKIMEDIA_ENRICHMENT_ENABLED: "true"
          DUBROVNIK_WIKIMEDIA_ENRICHMENT_ENABLED: "true"
        run: |
          failed=""
          for city in lisbon prague dubrovnik paris madrid barcelona sevilla london rome berlin dubai moscow athens; do
            if ! python run_report.py "$city" --skip-pdf; then
              failed="$failed $city"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed reports:$failed"
            exit 1
          fi
      - name: Verify fresh Europe data
        run: >-
          python scripts/check_data_freshness.py --max-age-hours 6 --cities
          lisbon prague dubrovnik paris madrid barcelona sevilla london rome berlin dubai moscow athens
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  asia-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: regression-tests
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.region == 'asia' || inputs.region == 'all')) || (github.event_name == 'schedule' && github.event.schedule == '37 23 * * *') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
          python -m pip install --no-cache-dir -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Reset and sync scoped runtime data (Asia)
        run: python scripts/reset_and_sync.py --region asia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY || secrets.RAPID_API_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY || secrets.RAPIDAPI_KEY }}
      - name: Generate Asia reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY || secrets.RAPID_API_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY || secrets.RAPIDAPI_KEY }}
          WIKIMEDIA_CLIENT_ID: ${{ secrets.WIKIMEDIA_CLIENT_ID }}
          WIKIMEDIA_CLIENT_SECRET: ${{ secrets.WIKIMEDIA_CLIENT_SECRET }}
        run: |
          failed=""
          for city in tokyo delhi; do
            if ! python run_report.py "$city" --skip-pdf; then
              failed="$failed $city"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed reports:$failed"
            exit 1
          fi
      - name: Verify fresh Asia data
        run: python scripts/check_data_freshness.py --max-age-hours 6 --cities tokyo delhi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
