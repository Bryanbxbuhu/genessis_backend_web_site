name: Validate Important Services Links

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-important-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Validate important services for all enabled cities
        run: |
          python scripts/validate_important_services_links.py --strict --no-network
